<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img"><title>Branches de Chasseur</title><desc>Arbre local cliquable, une feuille par activité principale.</desc><rect width="100%" height="100%" fill="#fbf8f0"/><g font-family="Segoe UI, sans-serif"><text x="28" y="36" font-size="23" fill="#25201a" text-anchor="start">Branches de Chasseur</text><text x="28" y="68" font-size="14" fill="#6a6152" text-anchor="start">Hiérarchie proposée ; généraliste et spécialisation sont des activités terminales distinctes.</text><rect x="30" y="110" width="325" height="80" rx="8" fill="#ece4d1" stroke="#d6c9a8"/><text x="50" y="141" font-size="18" fill="#25201a" text-anchor="start">Chasseur</text><path d="M355,150 H385 V145 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/chasse/chasse.md"><rect x="415" y="119" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="141" font-size="16" fill="#25201a" text-anchor="start">Chasseur de gibier</text><text x="435" y="163" font-size="12" fill="#6a6152" text-anchor="start">Généraliste</text></a><path d="M355,150 H385 V217 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/chasse/trappeur.md"><rect x="415" y="191" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="213" font-size="16" fill="#25201a" text-anchor="start">Trappeur</text><text x="435" y="235" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V289 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/chasse/chasseur-monstres.md"><rect x="415" y="263" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="285" font-size="16" fill="#25201a" text-anchor="start">Chasseur de monstres</text><text x="435" y="307" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V361 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/chasse/chasseur-marin.md"><rect x="415" y="335" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="357" font-size="16" fill="#25201a" text-anchor="start">Chasseur de monstres marins</text><text x="435" y="379" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V433 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/chasse/chasseur-dragons.md"><rect x="415" y="407" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="429" font-size="16" fill="#25201a" text-anchor="start">Chasseur de dragons</text><text x="435" y="451" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a></g></svg>