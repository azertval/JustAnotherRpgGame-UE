<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="746" viewBox="0 0 1100 746" role="img"><title>Branches de Extracteur de ressources minérales</title><desc>Arbre local cliquable, une feuille par activité principale.</desc><rect width="100%" height="100%" fill="#fbf8f0"/><g font-family="Segoe UI, sans-serif"><text x="28" y="36" font-size="23" fill="#25201a" text-anchor="start">Branches de Extracteur de ressources minérales</text><text x="28" y="68" font-size="14" fill="#6a6152" text-anchor="start">Hiérarchie proposée ; généraliste et spécialisation sont des activités terminales distinctes.</text><rect x="30" y="110" width="325" height="80" rx="8" fill="#ece4d1" stroke="#d6c9a8"/><text x="50" y="141" font-size="18" fill="#25201a" text-anchor="start">Extracteur de ressources</text><text x="50" y="164" font-size="18" fill="#25201a" text-anchor="start">minérales</text><path d="M355,150 H385 V145 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/extraction/mineur.md"><rect x="415" y="119" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="141" font-size="16" fill="#25201a" text-anchor="start">Mineur</text><text x="435" y="163" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V217 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/extraction/carrier.md"><rect x="415" y="191" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="213" font-size="16" fill="#25201a" text-anchor="start">Carrier</text><text x="435" y="235" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V289 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/extraction/salinier.md"><rect x="415" y="263" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="285" font-size="16" fill="#25201a" text-anchor="start">Salinier</text><text x="435" y="307" font-size="12" fill="#6a615