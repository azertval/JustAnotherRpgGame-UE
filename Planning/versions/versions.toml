[[version]]
id = "0.0.1"
titre = "Démo basique"
nature = "detaillee"
referentiel = "0.1.0"
dossier = "v0.1.0/v0.0.1-demo"
resume = "Le standard 2D HD, le moteur de la quête, et une quête jouée de bout en bout sur trois cartes de principe : du marché de Martpart au sable de l'Arena of Fate."
objectifs = [
  "Le **standard 2D HD** : un style écrit, une arborescence d'assets durable, et plus un seul asset pixel art dans le dépôt.",
  "Trois **cartes de principe** enchaînées — **Martpart**, **Arenarea**, et dans Arenarea le donjon de l'**Arena of Fate** —, jouables en maquette (LOT-146) ; leurs assets, leurs PNJ et leurs cartes définitives sont à la `0.0.3` (décision D-25).",
  "Les cinq PNJ de la quête, tenus par le **mannequin** humanoïde installé au LOT-118 ou des **jetons** (LOT-128) jusqu'à leur production ; les mannequins complets (LOT-145) sont à la `0.0.2` (décision D-26).",
  "La quête **« Des pommes pour l'arène »**, jouable de bout en bout : dialogue, jet de Persuasion, combat seul contre un, deux fins.",
]
criteres_de_sortie = [
  "Un joueur qui ne connaît pas le projet termine la démo par chacune de ses **trois issues** (persuasion réussie, victoire, mort) sans aide.",
  "Aucun asset pixel art ne reste dans `Source/Elements/Assets/` (les cartes peintes et le HUD, déjà au standard, sont gardés) ; la galerie de débug montre tous les assets HD.",
  "Les trois cartes de principe — l'Arena of Fate en compte deux, un niveau étant une carte — s'enchaînent par leurs portails, passent le contrôle de l'éditeur (`--check`) et se parcourent sans case inatteignable.",
  "La CI est verte, l'installeur se lance sur un poste vierge, le tag `v0.0.1` est posé.",
]
sources = [
  "Tanares Sourcebook — la Capitale et ses quartiers (chapitre Central Empire)",
  "Character Compendium — PNJ de l'Empire central (index p. 166)",
]

[[version]]
id = "0.0.2"
titre = "Système de combat"
nature = "detaillee"
referentiel = "0.1.0"
dossier = "v0.1.0/v0.0.2-combat"
resume = "Les quatre classes de base, d'après leurs fiches préfabriquées, et le combat de groupe."
objectifs = [
  "Les **quatre classes de base** du *Player's Guide*, fidèles aux fiches préfabriquées (p. 195, 199, 203, 207) : compétences, capacités, assets.",
  "Le **combat de groupe** : plusieurs personnages joués contre plusieurs adversaires.",
  "Une **interface à jour** : les profils des personnages dans le combat, la fiche et le groupe.",
  "Les **mannequins de remplacement** (LOT-145, repris de la `0.0.1` par la décision D-26) : l'humanoïde dans les quatre orientations, pour que chaque créature d'une rencontre se voie et s'anime avant sa figurine ; les silhouettes quadrupède et volante ne sont pas produites en 2D (décision D-34).",
]
criteres_de_sortie = [
  "Chacune des quatre fiches préfabriquées se recrée dans le jeu, valeur pour valeur.",
  "Un combat à quatre contre quatre se joue de bout en bout dans l'Arena of Fate, au clavier comme à la manette.",
  "Chaque capacité de classe des fiches a un effet en combat et une ligne dans le journal.",
]
sources = [
  "Player's Guide to Tanares — classes simplifiées, p. 192-208 ; fiches préfabriquées p. 195, 199, 203, 207",
]

[[version]]
id = "0.0.2.5"
titre = "Passage à la 3D"
nature = "detaillee"
referentiel = "0.1.0"
dossier = "v0.1.0/v0.0.2.5-passage-3d"
resume = "Le jeu garde sa vue isométrique et passe en 3D : un personnage est un maillage qui lui est propre, lié à un squelette partagé ; la scène est éclairée, avec un cycle jour / nuit ; l'Arena of Fate est en maillages. Chaque lot retire ce qu'il remplace."
objectifs = [
  "Une **production de personnages stable** : un maillage par personnage, généré depuis une image de référence et lié par script au squelette commun de sa silhouette, dont les clips sont réglés une fois (décision D-38, qui remplace les huit corps de D-31).",
  "Un **cycle jour / nuit** sous la même caméra isométrique : soleil, ombres portées, lumières de nuit. Le **décor d'architecture en maillages** du kit de la Capitale est reporté à la version des trois lieux (décision D-43, 2 octobre 2026 ; la `0.0.4` depuis D-48) ; celui de l'Arena of Fate est livré (décision D-46).",
  "Un **atelier des assets 3D** dans l'éditeur : la fiche d'un personnage, son aperçu, son installation, et l'aller-retour par Blender (décisions D-33 et D-44).",
  "Un **dépôt sans asset mort** : chaque lot nomme ce qu'il supprime, et le supprime dans sa propre PR (décision D-32).",
]
criteres_de_sortie = [
  "La quête « Des pommes pour l'arène » et un combat à quatre contre quatre se rejouent de bout en bout en 3D, de jour comme de nuit, au clavier et à la souris — la manette, que ce critère nommait, a été retirée du jeu le 2 octobre 2026.",
  "Les quatre héros sont des modèles installés par l'atelier ; plus aucune bande d'animation de figurine ne reste dans le dépôt ni dans les kits (les effets de `Common/Fx/` restent des bandes).",
  "L'éditeur montre exactement ce que le jeu dessine : ils partagent un seul rendu, et plus aucun peintre `QPainter` ne dessine la scène.",
  "Le contrôle des orphelins passe : tout fichier installé est cité par un manifeste ou une fiche, toute entrée citée existe, et les seules images de décor restantes sont celles de la dette déclarée pour la version des trois lieux (la `0.0.4` depuis D-48).",
]
sources = [
  "Audit de faisabilité du 30 septembre 2026 — https://claude.ai/code/artifact/9cffa31b-7b23-4e0a-8df9-1c0cb9534523",
]

[[version]]
id = "0.0.3"
titre = "Le nouveau moteur"
nature = "detaillee"
referentiel = "0.1.0"
dossier = "v0.1.0/v0.0.3-nouveau-moteur"
resume = "Le jeu passe sur Unreal Engine 5 (décision D-48) : caméra libre en perspective, combat en distance à la manière de Baldur's Gate 3, cartes composées librement, lumière et matière au niveau d'un moteur du commerce. Core reste la bibliothèque des règles ; le moteur maison, l'interface Qt Quick et le LevelEditor sont retirés."
objectifs = [
  "Un **rendu au niveau de l'atlas** : Lumen, Nanite, ombres virtuelles, anticrénelage temporel ; un lieu se juge sur captures du moteur à midi et à 22 h contre sa carte peinte (décision D-54).",
  "Le **combat en distance** (décision D-50) : mètres du *Manuel*, maillage de navigation, ligne de vue par rayon, zones en volumes, hauteur comptée ; les règles, les classes et les capacités de la `0.0.2` ne changent pas.",
  "Une **carte composée** (décision D-51) : terrain, objets à transformation libre, étages praticables, construite par script depuis une description en texte (décision D-52).",
  "Les **vingt personnages** et les maillages de l'Arena of Fate importés au maître (décision D-53) ; la chaîne Meshy et l'atelier Blender gardés.",
  "Un **dépôt sans moteur mort** : Qt, QRhi, QML, le LevelEditor et le format de carte v4 sont supprimés dans la PR de la recette (décision D-32).",
]
criteres_de_sortie = [
  "La porte (LOT-1012) a été vue et acceptée par l'auteur avant tout autre lot : parvis d'Arenarea rendu à midi et à 22 h, 60 images par seconde à 1080p, carte construite par script.",
  "La quête « Des pommes pour l'arène » et la série de l'arène se rejouent de bout en bout sur le nouveau moteur, en distance, de jour comme de nuit, au clavier et à la souris.",
  "Arenarea est reconstruit au standard D-54 et validé par l'auteur sur le rendu du moteur ; l'Arena of Fate et Martpart sont portés.",
  "Plus une ligne de Qt, de QML ni de QRhi dans `Source/` ; les tests, les lints et `check_orphans.py` passent sur le nouveau projet ; le tag `v0.0.3` est posé.",
]
sources = [
  "Plan d'action du 7 octobre 2026 — https://claude.ai/artifact/AHU61AmvLTCPBmDmUBd2Em",
]

