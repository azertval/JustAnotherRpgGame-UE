<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="818" viewBox="0 0 1100 818" role="img"><title>Branches de Éleveur</title><desc>Arbre local cliquable, une feuille par activité principale.</desc><rect width="100%" height="100%" fill="#fbf8f0"/><g font-family="Segoe UI, sans-serif"><text x="28" y="36" font-size="23" fill="#25201a" text-anchor="start">Branches de Éleveur</text><text x="28" y="68" font-size="14" fill="#6a6152" text-anchor="start">Hiérarchie proposée ; généraliste et spécialisation sont des activités terminales distinctes.</text><rect x="30" y="110" width="325" height="80" rx="8" fill="#ece4d1" stroke="#d6c9a8"/><text x="50" y="141" font-size="18" fill="#25201a" text-anchor="start">Éleveur</text><path d="M355,150 H385 V145 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/elevage.md"><rect x="415" y="119" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="141" font-size="16" fill="#25201a" text-anchor="start">Éleveur généraliste</text><text x="435" y="163" font-size="12" fill="#6a6152" text-anchor="start">Généraliste</text></a><path d="M355,150 H385 V217 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/berger.md"><rect x="415" y="191" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="213" font-size="16" fill="#25201a" text-anchor="start">Berger</text><text x="435" y="235" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V289 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/yak.md"><rect x="415" y="263" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="285" font-size="16" fill="#25201a" text-anchor="start">Éleveur de yaks</text><text x="435" y="307" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V361 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/chevaux.md"><rect x="415" y="335" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="357" font-size="16" fill="#25201a" text-anchor="start">Éleveur de chevaux</text><text x="435" y="379" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V433 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/chameaux.md"><rect x="415" y="407" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="429" font-size="16" fill="#25201a" text-anchor="start">Éleveur de chameaux</text><text x="435" y="451" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V505 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/sericulture.md"><rect x="415" y="479" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="501" font-size="16" fill="#25201a" text-anchor="start">Éleveur de vers à soie</text><text x="435" y="523" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V577 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/loups.md"><rect x="415" y="551" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="573" font-size="16" fill="#25201a" text-anchor="start">Éleveur de loups géants</text><text x="435" y="595" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V649 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/elevage/montures-volantes.md"><rect x="415" y="623" width="650" height="57" rx="5" fill="#ece4d1" stroke="#d6c9a8"/><text x="435" y="645" font-size="16" fill="#25201a" text-anchor="start">Éleveur de montures volantes</text><text x="435" y="667" font-size="12" fill="#6a6152" text-anchor="start">Spécialisation</text></a><path d="M355,150 H385 V721 H415" fill="none" stroke="#2f7f86"/><a href="../../Specialisations/eleva