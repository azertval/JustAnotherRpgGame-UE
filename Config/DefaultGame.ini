; La caméra libre (D-49, D-56, LOT-1016). Inclinaisons en degrés sous l'horizon, distances en
; centimètres. L'inclinaison est bornée entre 25 et 70 degrés par la fiche du LOT-1016 ; les
; distances sont celles de la porte (LOT-1012), que l'auteur n'a pas encore jugées dans une fenêtre.
; ProbeSize : le rayon de la sphère qui garde la caméra hors du sol et des murs. FollowSpeed : la
; vivacité du suivi du meneur.
[/Script/JustAnotherRpgGame.JadgCameraPawn]
MinPitch=25.0
MaxPitch=70.0
MinDistance=400.0
MaxDistance=12000.0
StartPitch=40.0
StartDistance=1600.0
FollowHeight=100.0
ProbeSize=12.0
FollowSpeed=6.0

