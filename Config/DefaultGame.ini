[/Script/JustAnotherRpgGame.JadgParty]
EmptyArenaMap=/Game/Maps/Essai1016Arene

; Les commandes du jeu (LOT-1016), au clavier et à la souris. Une ligne par touche : la commande
; (JadgControls.h en donne la liste), la touche par son nom du moteur, et pour un axe ce par quoi
; sa valeur est multipliée. Une touche se change ici, sans recompiler.
; Décision de l'auteur, 8 octobre 2026 : F pour interagir, C pour tourner la caméra — C tenue, la
; souris tourne et incline, comme le clic droit tenu. F prise, incliner au clavier passe à R / V ;
; C prise, recentrer reste sur Début.
[/Script/JustAnotherRpgGame.JadgControls]
