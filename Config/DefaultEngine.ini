[SystemSettings]
; Build landscapes sequentially on the 16 GB authoring workstation.
landscape.Nanite.MultithreadBuild=0
landscape.Nanite.MaxSimultaneousMultithreadBuilds=1
Editor.AsyncStaticMeshCompilationMaxConcurrency=1
; Arena pilot: supplied Sensei Nanite material displacement.
