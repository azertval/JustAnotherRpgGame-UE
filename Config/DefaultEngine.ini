; The Arena of Fate cavea (19 October 2026) and the Landscape exceed the default 512 MB Nanite
; streaming pool: the facade columns fell back to coarse clusters. 2048 MB crashes this GPU.
r.Nanite.Streaming.StreamingPoolSize=1024
; Demo of the capital (20 October 2026, frame profile): a streamed World Partition cell of the
; arena registered its components and cached its draw commands in one frame (up to 130 ms).
; Unreal's adaptive AddToWorld spreads that work over 1-6 ms per frame; registration goes by
; smaller batches. Nothing is simplified: the same actors arrive a few frames later.
s.AdaptiveAddToWorld.Enabled=1
s.LevelStreamingComponentsRegistrationGranularity=5
s.LevelStreamingComponentsUnregistrationGranularity=5
; The arena's textures overflowed the default texture streaming pool ("over 420 MiB budget",
; blurred mips at the start of the demo, 20 October 2026); the captures already ran with 4000 MB.
r.Streaming.PoolSize=2500

